modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Changed: Minecraft Mod. Load after it so its entities are known.
# Marked optional so the game still starts if the Changed mod id ever changes;
# without Changed you get the humans, items and structures but no latex / Puro / latex bosses.
[[dependencies.${mod_id}]]
    modId="changed"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# First Aid mod (optional). Only used for the "firstAidMod" settings.
[[dependencies.${mod_id}]]
    modId="firstaid"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
