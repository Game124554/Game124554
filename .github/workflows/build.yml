name: Build Realistic Overhaul

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        run: |
          msg=$(grep -E "error:|What went wrong|FAILURE" -A3 build.log | head -150 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Build failed::$msg"
      - name: Report mixin warnings
        if: always()
        run: |
          msg=$(grep -iE "warning:.*(mixin|target|refmap|Cannot|Unable)" build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          if [ -n "$msg" ]; then echo "::warning title=Mixin warnings::$msg"; else echo "::notice title=Mixin warnings::none"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: realistic-overhaul-jar
          path: build/libs/realistic-overhaul-1.0.0.jar
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view realistic-overhaul-v1.0.0 >/dev/null 2>&1 || gh release create realistic-overhaul-v1.0.0 --target "$GITHUB_SHA" \
            --title "Realistic Overhaul 1.0.0 (Fabric 1.20.1)" \
            --notes "Put realistic-overhaul-1.0.0.jar in .minecraft/mods together with Fabric API for 1.20.1. Press O in game for settings."
          gh release upload realistic-overhaul-v1.0.0 build/libs/realistic-overhaul-1.0.0.jar --clobber
