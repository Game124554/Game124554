# Builds the mod jar in the cloud. Push this project to a GitHub repository,
# open the "Actions" tab, pick the latest run and download the "latexdrones-jar" artifact.
name: Build mod
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: latexdrones-jar
          path: build/libs/*.jar
