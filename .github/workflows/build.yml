name: Build Realistic Overhaul

on:
  push:
    branches: [realistic-overhaul]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('build.gradle', 'gradle.properties', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build jar
        id: build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
          mkdir -p dist && cp build/libs/realistic-overhaul-*.jar dist/
          ls -la dist

      - name: Report compile errors
        if: failure() && steps.build.outcome == 'failure'
        run: |
          msg=$(grep -E "error:|What went wrong|FAILURE" -A3 build.log | head -150 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Build failed::$msg"

      - name: Server self-test (vanilla terrain, then realistic terrain)
        id: server
        if: steps.build.outcome == 'success'
        timeout-minutes: 20
        env:
          RO_SELFTEST: server
        run: |
          mkdir -p run ci
          echo "eula=true" > run/eula.txt
          write_props() {
            cat > run/server.properties <<PROPS
          level-name=$1
          level-seed=20261103
          initial-disabled-packs=$2
          online-mode=false
          max-tick-time=-1
          view-distance=8
          simulation-distance=6
          spawn-protection=0
          sync-chunk-writes=false
          PROPS
          }
          write_props world_vanilla realisticoverhaul:realistic_terrain
          timeout 900 ./gradlew runServer -PmixinRequire=1 --no-daemon 2>&1 | tail -400 > ci/gradle_server_vanilla.txt || true
          cp run/logs/latest.log ci/server_vanilla.log || true
          write_props world ""
          timeout 900 ./gradlew runServer -PmixinRequire=1 --no-daemon 2>&1 | tail -400 > ci/gradle_server_realistic.txt || true
          cp run/logs/latest.log ci/server_realistic.log || true
          cat run/selftest/server_results.txt || true
          grep -q "SERVER DONE" ci/server_realistic.log

      - name: Client self-test (virtual screen, screenshots)
        id: client
        if: steps.build.outcome == 'success'
        timeout-minutes: 30
        env:
          RO_SELFTEST: client
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
          mkdir -p run/saves ci
          rm -rf run/saves/selftest && cp -r run/world run/saves/selftest
          rm -f run/saves/selftest/session.lock
          cat > run/options.txt <<'OPTS'
          version:3465
          onboardAccessibility:false
          renderDistance:8
          simulationDistance:6
          pauseOnLostFocus:false
          tutorialStep:none
          skipMultiplayerWarning:true
          joinedFirstServer:true
          guiScale:2
          ao:true
          graphicsMode:1
          soundCategory_master:0.0
          OPTS
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -PmixinRequire=1 --no-daemon 2>&1 | tail -400 > ci/gradle_client.txt || true
          cp run/logs/latest.log ci/client.log || true
          cat run/selftest/client_results.txt || true
          grep -q "CLIENT DONE" ci/client.log

      - name: Publish CI results to the ci-results branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-out
          cp build.log ci-out/ 2>/dev/null || true
          cp -r ci/. ci-out/ 2>/dev/null || true
          cp run/selftest/* ci-out/ 2>/dev/null || true
          cp run/screenshots/*.png ci-out/ 2>/dev/null || true
          cp run/crash-reports/* ci-out/ 2>/dev/null || true
          cp dist/*.jar ci-out/ 2>/dev/null || true
          echo "${GITHUB_SHA} build=${{ steps.build.outcome }} server=${{ steps.server.outcome }} client=${{ steps.client.outcome }}" > ci-out/STATUS.txt
          cd ci-out
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-results
          git add -A
          git commit -qm "CI results for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: realistic-overhaul-jar
          path: dist/*.jar

      - name: Publish release
        if: steps.build.outcome == 'success' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="realistic-overhaul-v$V"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Realistic Overhaul $V (Fabric 1.20.1)" \
            --notes-file RELEASE_NOTES.md
          gh release upload "$TAG" dist/realistic-overhaul-$V.jar --clobber
