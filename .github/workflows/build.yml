name: Build

on:
  push:
    branches: [ main, teardown-voxel-physics ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: teardown_voxel-jar
          path: build/libs/*.jar

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}"
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --title "Teardown Voxel Physics ${VERSION} (Fabric 1.20.1)" \
              --notes "Built automatically from ${GITHUB_SHA}. Drop the jar into your mods folder alongside Fabric API (Fabric Loader 0.15+, Minecraft 1.20.1)."
          fi
