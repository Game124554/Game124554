name: Build

on:
  push:
    branches: [ main, teardown-voxel-physics ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Show mixin refmap
        run: unzip -p build/libs/teardown_voxel-*.jar teardown_voxel-refmap.json

      - name: Dedicated server smoke test
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\ngenerate-structures=false\n' > run/server.properties
          timeout 900 ./gradlew runServer -Pselftest --console=plain 2>&1 | tee server.log || true
          grep -E "SELFTEST|Mixin|mixin|Exception|ERROR" server.log | grep -v "DEBUG" | head -80 || true
          grep -q "SELFTEST PASS" server.log

      - name: Headless client smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -Pselftest --console=plain 2>&1 | tee client.log || true
          grep -E "CLIENT SELFTEST|teardown_voxel|Exception|ERROR|Missing|missing" client.log | grep -v DEBUG | head -80 || true
          grep -q "CLIENT SELFTEST PASS" client.log

      - name: Upload jar artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teardown_voxel-jar
          path: |
            build/libs/*.jar
            server.log
            client.log

      - name: Commit jar to branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/teardown-voxel-physics'
        run: |
          mkdir -p dist
          rm -f dist/*.jar
          cp $(ls build/libs/*.jar | grep -v -- '-sources') dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Built jar for ${GITHUB_SHA::7} [skip ci]"
          git push

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}"
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --title "Teardown Voxel Physics ${VERSION} (Fabric 1.20.1)" \
              --notes "Built automatically from ${GITHUB_SHA}. Drop the jar into your mods folder alongside Fabric API (Fabric Loader 0.15+, Minecraft 1.20.1)."
          fi
