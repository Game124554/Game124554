name: build
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: scp-foundation-jar
          path: build/libs/*.jar
      - name: Dedicated server boot test (loads every block, entity, structure and the pocket dimension)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nspawn-protection=0\nview-distance=6\n" > run/server.properties
          ./gradlew runServer --no-daemon > server.log 2>&1 &
          for i in $(seq 1 120); do
            if grep -q "Done (" server.log; then break; fi
            if grep -qE "Failed to start the minecraft server|Exception in server tick loop|Encountered an unexpected exception" server.log; then break; fi
            sleep 5
          done
          sleep 20
          pkill -f "net.fabricmc" || true
          grep -nE "scpfoundation|ERROR|Exception|Done \(" server.log | head -200
          grep -q "Done (" server.log
          if grep -nE "ERROR.*(scpfoundation|Couldn't load|Failed to (load|parse))" server.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: server.log
      - name: Publish the jar as a GitHub Release (easy download from a phone)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scp-foundation-latest
          name: SCP Foundation mod (Minecraft 1.20.1 Fabric) - latest build
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            Download **scp-foundation-1.0.0.jar** below and put it in `.minecraft/mods` together with Fabric Loader and Fabric API 0.92.x for Minecraft 1.20.1.
            Built automatically from commit ${{ github.sha }}. This build passed a dedicated-server boot test.
          files: build/libs/scp-foundation-1.0.0.jar
