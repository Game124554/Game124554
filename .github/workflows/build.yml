name: Build mod jar

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          { grep -A3 -E "error:" build.log | grep -v "^--$" | sed "s#.*/src/main/java/##" | head -80; grep -A6 "What went wrong" build.log | head -14; } > errs.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errs.txt)
          echo "::error title=Build errors::$msg"

      - name: Upload the .jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish download link (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mod-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" build/libs/*.jar --target "$GITHUB_SHA" \
            --title "Mandela Catalogue Horror - latest build ($GITHUB_REF_NAME)" \
            --notes "Fabric 1.20.1. Needs Fabric API and GeckoLib (Fabric 1.20.1, 4.4.9+). Put the .jar in your mods folder."
