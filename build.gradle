plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Release builds tolerate a missing injection point (better than crashing next to other mods).
// CI tests run with -PmixinRequire=1 so every injection must apply.
def mixinRequire = project.findProperty("mixinRequire") ?: "0"

processResources {
	inputs.property "version", project.version
	inputs.property "mixinRequire", mixinRequire
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
	filesMatching("realisticoverhaul.mixins.json") {
		expand "mixinRequire": mixinRequire
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}" }
	}
}
